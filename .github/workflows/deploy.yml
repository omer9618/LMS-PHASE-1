# Build the API images, push them to GHCR and deploy over SSH to a VPS (docs/DEPLOYMENT.md).
#
# - Staging: automatically after CI passes on main.
# - Production: manually (Actions > Deploy > Run workflow > production), ideally with the image
#   tag (commit SHA) already running on staging. Protect the `production` environment with
#   required reviewers in the repository settings.
#
# Does nothing until the repository secret DEPLOY_SSH_KEY exists: every job after `gate` is
# skipped, so this workflow is safe to merge before the VPS exists.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Existing image tag (a commit SHA) to deploy without rebuilding. Empty = build the selected ref.
        type: string
        required: false

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # workflow_run: only a successful CI run for a push to main in this repository. A pull request
    # from a fork whose branch happens to be called main must never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      environment: ${{ steps.check.outputs.environment }}
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
      api_image: ${{ steps.check.outputs.api_image }}
      tools_image: ${{ steps.check.outputs.tools_image }}
    steps:
      - name: Decide what to deploy
        id: check
        env:
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          TARGET: ${{ inputs.environment || 'staging' }}
          INPUT_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$HAS_SSH_KEY" != true ]; then
            echo "::notice::Deploy skipped: the DEPLOY_SSH_KEY secret is not configured (docs/DEPLOYMENT.md)."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_TAG" ] && ! [[ $INPUT_TAG =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::invalid image_tag: $INPUT_TAG"; exit 1
          fi
          repo=${GITHUB_REPOSITORY,,}
          {
            echo "enabled=true"
            echo "environment=$TARGET"
            echo "sha=$SHA"
            echo "tag=${INPUT_TAG:-$SHA}"
            if [ -n "$INPUT_TAG" ]; then echo "build=false"; else echo "build=true"; fi
            echo "api_image=ghcr.io/${repo}-api"
            echo "tools_image=ghcr.io/${repo}-tools"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ needs.gate.outputs.api_image }}:${{ needs.gate.outputs.tag }}
          build-args: GIT_SHA=${{ needs.gate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the tools image (migrations, seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: ${{ needs.gate.outputs.tools_image }}:${{ needs.gate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

  deploy:
    needs: [gate, build]
    # Runs after a successful build, or straight away when redeploying an existing tag.
    if: >-
      always() && needs.gate.outputs.enabled == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.gate.outputs.environment }}
      url: ${{ vars.API_PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      ENVIRONMENT: ${{ needs.gate.outputs.environment }}
      TAG: ${{ needs.gate.outputs.tag }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || format('/opt/lms/{0}', needs.gate.outputs.environment) }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
    steps:
      - name: Check the environment is configured
        env:
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("variable DEPLOY_HOST")
          [ -n "$API_PUBLIC_URL" ] || missing+=("variable API_PUBLIC_URL")
          [ "$HAS_KNOWN_HOSTS" = true ] || missing+=("secret DEPLOY_KNOWN_HOSTS")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The '$ENVIRONMENT' environment is missing: ${missing[*]} (docs/DEPLOYMENT.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          sparse-checkout: deploy

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Sync compose file and scripts
        run: |
          # $DEPLOY_PATH is meant to expand on the runner (SC2029).
          # shellcheck disable=SC2029
          ssh target "test -f '$DEPLOY_PATH/.env' && test -f '$DEPLOY_PATH/api.env'" || {
            echo "::error::$DEPLOY_PATH/.env or api.env is missing on the server (docs/DEPLOYMENT.md, first deploy)"
            exit 1
          }
          scp -q deploy/compose.yml "target:$DEPLOY_PATH/compose.yml"
          scp -q deploy/scripts/*.sh "target:$DEPLOY_PATH/scripts/"
          # shellcheck disable=SC2029
          ssh target "chmod 750 '$DEPLOY_PATH'/scripts/*.sh"

      - name: Deploy (migrations + rolling restart)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # Short-lived registry login with this job's token; removed again in the next step.
          # Variables in the ssh commands are meant to expand on the runner (SC2029).
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" | ssh target "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin" >/dev/null
          # shellcheck disable=SC2029
          ssh target "cd '$DEPLOY_PATH' && scripts/deploy.sh '$TAG'"

      - name: Registry logout
        if: always()
        run: ssh target "docker logout ghcr.io" >/dev/null 2>&1 || true

      - name: Health check through the proxy
        run: |
          for attempt in $(seq 1 20); do
            if body=$(curl -fsS --max-time 10 "$API_PUBLIC_URL/health"); then
              echo "$body"
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 6
          done
          echo "::error::$API_PUBLIC_URL/health did not answer 200 after the deploy"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to $ENVIRONMENT: ${{ job.status }}"
            echo "- Image tag: \`$TAG\`"
            echo "- Health: $API_PUBLIC_URL/health"
            echo "- Roll back: \`ssh $DEPLOY_USER@$DEPLOY_HOST 'cd $DEPLOY_PATH && scripts/rollback.sh'\`"
          } >>"$GITHUB_STEP_SUMMARY"
